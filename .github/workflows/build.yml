name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (engine, puzzle database, app)
        run: ./gradlew --no-daemon :core:test testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ENCRYPTED-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ENCRYPTED-debug-apk
          path: ENCRYPTED-debug.apk

      # Puts the APK on the Releases page so it can be downloaded straight to a phone.
      - name: Publish "latest" debug release
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest ENCRYPTED-debug.apk \
            --title "ENCRYPTED (latest debug build)" \
            --notes "Debug APK built from ${GITHUB_SHA::7}. Download ENCRYPTED-debug.apk on your Android phone and open it to install." \
            --target "$GITHUB_SHA" \
            --prerelease
